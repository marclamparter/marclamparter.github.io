<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Pattern Generator  pattern system</title>
<style>
  :root{
    --bg:#0B0B0C; --panel:#111113; --line:#1C1C20; --line2:#2A2A30;
    --fg:#EFE9DC; --mut:#8C887E; --dim:#5A574F; --accent:#C6DDD3;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;
    line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    height:100vh;overflow:hidden}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line);flex:0 0 auto}
  header h1{font-size:14px;font-weight:600;letter-spacing:.02em}
  header .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  header .lock{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--bg);background:var(--accent);padding:2px 7px;border-radius:3px;margin-left:auto}
  .app{flex:1 1 auto;display:flex;min-height:0}

  aside{width:300px;flex:0 0 auto;border-right:1px solid var(--line);overflow-y:auto;
    padding:6px 0 40px;background:var(--panel)}
  aside::-webkit-scrollbar{width:9px}
  aside::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--panel)}
  .group{padding:14px 18px;border-bottom:1px solid var(--line)}
  .group h2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mut);margin-bottom:12px;font-weight:500}
  .ctl{margin-bottom:13px} .ctl:last-child{margin-bottom:2px}
  .ctl label{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:11px;color:var(--fg);margin-bottom:6px}
  .ctl label .val{color:var(--mut)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;
    background:var(--line2);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--fg);cursor:pointer;border:2px solid var(--panel)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
    background:var(--fg);cursor:pointer;border:2px solid var(--panel)}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent)}

  .engines{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .eng{font-family:var(--mono);font-size:10.5px;text-align:left;padding:8px 9px;
    border:1px solid var(--line2);background:transparent;color:var(--mut);border-radius:4px;
    cursor:pointer;transition:.12s;line-height:1.25}
  .eng:hover{border-color:var(--dim);color:var(--fg)}
  .eng.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .eng:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .seedrow{display:flex;gap:8px;align-items:center}
  .seedrow input[type=number]{flex:1;background:var(--bg);border:1px solid var(--line2);
    color:var(--fg);font-family:var(--mono);font-size:12px;padding:7px 9px;border-radius:4px;width:100%}
  .seedrow input[type=number]:focus{outline:none;border-color:var(--dim)}
  button.act{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:8px 12px;
    border:1px solid var(--line2);background:transparent;color:var(--fg);border-radius:4px;
    cursor:pointer;transition:.12s;white-space:nowrap}
  button.act:hover{border-color:var(--fg)}
  button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .legend{display:flex;flex-direction:column;gap:8px}
  .lgrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;color:var(--mut)}
  .lgbar{background:var(--accent);flex:0 0 auto}
  .lgrow span{white-space:nowrap}

  .swatches{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .sw{width:30px;height:30px;border-radius:4px;cursor:pointer;border:1px solid var(--line2);
    position:relative;overflow:hidden}
  .sw.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
  .sw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:13px;font-weight:600}
  .colrow{display:flex;gap:10px}.colrow .cc{flex:1}
  .colrow label{font-family:var(--mono);font-size:10px;color:var(--mut);display:block;
    margin-bottom:5px;letter-spacing:.06em}
  .colrow input[type=color]{width:100%;height:30px;border:1px solid var(--line2);
    background:var(--bg);border-radius:4px;cursor:pointer;padding:2px}

  .ratios{display:flex;gap:6px;flex-wrap:wrap}
  .rt{font-family:var(--mono);font-size:10px;padding:6px 9px;border:1px solid var(--line2);
    background:transparent;color:var(--mut);border-radius:4px;cursor:pointer}
  .rt:hover{color:var(--fg);border-color:var(--dim)}
  .rt.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}.exports button{padding:10px}

  main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:#08080A}
  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:28px;
    min-height:0;overflow:hidden}
  .frame{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5);line-height:0}
  .frame svg{display:block;max-width:100%;max-height:calc(100vh - 160px);width:auto;height:auto}
  .statusbar{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 20px;display:flex;
    justify-content:space-between;align-items:center;gap:16px}
  .readout{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .readout b{color:var(--mut);font-weight:500}
  .dims{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}

  @media(max-width:780px){
    body{overflow:auto;height:auto}.app{flex-direction:column}
    aside{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .frame svg{max-height:60vh}
  }
</style>
</head>
<body>
<header>
  <h1>Brand Pattern Generator</h1>
  <span class="tag">yasp pattern system</span>
  <span class="lock">grammar-locked</span>
</header>

<div class="app">
  <aside>
    <div class="group">
      <h2>Composition</h2>
      <div class="engines" id="engines"></div>
    </div>

    <div class="group">
      <h2>Seed</h2>
      <div class="seedrow">
        <input type="number" id="seed" value="1042" min="0" step="1" aria-label="Seed value">
        <button class="act" id="shuffle">Shuffle</button>
      </div>
    </div>

    <div class="group">
      <h2>Parameters</h2>
      <div id="engineParams"></div>
    </div>

    <div class="group">
      <h2>System unit</h2>
      <div class="ctl">
        <label>Scale <span class="val" id="vscale"></span></label>
        <input type="range" id="scale" min="0.4" max="2.5" step="0.05" value="1">
      </div>
      <div class="ctl">
        <label>Opacity <span class="val" id="vopacity"></span></label>
        <input type="range" id="opacity" min="0.2" max="1" step="0.02" value="1">
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="group">
      <h2>Palette</h2>
      <div class="swatches" id="swatches"></div>
      <div class="colrow">
        <div class="cc"><label>Ground</label><input type="color" id="bg" value="#212121"></div>
        <div class="cc"><label>Segment</label><input type="color" id="line" value="#C6DDD3"></div>
      </div>
    </div>

    <div class="group">
      <h2>Canvas</h2>
      <div class="ratios" id="ratios"></div>
    </div>

    <div class="group">
      <h2>Export</h2>
      <div class="exports">
        <button class="act" id="dlsvg">SVG</button>
        <button class="act" id="dlpng">PNG</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="stage">
      <div class="frame"><svg id="art" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div class="statusbar">
      <div class="readout" id="readout"></div>
      <div class="dims" id="dims"></div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";
  const NS="http://www.w3.org/2000/svg";

  /* ---- brand grammar (exact values from the system SVG) ---- */
  // index 0 = heavy, 1 = medium, 2 = light. Length & weight inverse; heavy/medium iso-area.
  const TIERS=[
    {key:"heavy", w:65.5,  h:6.2},
    {key:"medium",w:131.0, h:3.1},
    {key:"light", w:169.5, h:1.5}
  ];

  function makeRng(seed){let s=seed>>>0;return function(){s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;};}
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;

  function el(p,tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
  // place one brand-legal segment; y is the segment's vertical centre
  function seg(g,x,y,tier,ctx){
    const w=tier.w*ctx.scale, h=tier.h*ctx.scale;
    el(g,"rect",{x:x.toFixed(2),y:(y-h/2).toFixed(2),width:w.toFixed(2),height:h.toFixed(2),
      fill:ctx.color,"fill-opacity":ctx.opacity,"shape-rendering":"crispEdges"});
  }
  // map a value 0..1 to a tier (low=light/thin, high=heavy/thick); bias shifts the mix
  function pickTier(v,bias){
    const lowT=clamp(0.42-bias*0.32,0.05,0.92);
    const highT=clamp(0.76-bias*0.28,lowT+0.05,0.97);
    return v<lowT?TIERS[2]:v<highT?TIERS[1]:TIERS[0];
  }

  /* ---------- composition engines (emit only brand tiers) ---------- */
  const ENGINES={

    rows:{ label:"Stacked rows", params:[
        {key:"pitch", label:"Row pitch",  min:8,max:60,step:1,def:15},
        {key:"gap",   label:"Segment gap",min:0,max:90,step:1,def:18},
        {key:"bias",  label:"Weight bias",min:-100,max:100,step:1,def:0},
        {key:"jitter",label:"Row offset", min:0,max:100,step:1,def:0}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, s=c.scale, pitch=p.pitch*s, gap=p.gap*s, bias=p.bias/100;
        for(let y=pitch;y<H+pitch;y+=pitch){
          let x=rng()*p.jitter*s - p.jitter*s*0.5;
          while(x<W){
            const t=pickTier(rng(),bias);
            seg(g,x,y,t,c);
            x+=t.w*s+gap;
          }
        }
      }
    },

    field:{ label:"Density field", params:[
        {key:"pitch",   label:"Row pitch",  min:8,max:50,step:1,def:14},
        {key:"field",   label:"Field scale",min:2,max:40,step:1,def:10},
        {key:"contrast",label:"Contrast",   min:0,max:100,step:1,def:50},
        {key:"cutoff",  label:"Cutoff",     min:0,max:85,step:1,def:0}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, s=c.scale, pitch=p.pitch*s, fs=p.field/1000;
        const a1=rng()*9,a2=rng()*9,a3=rng()*9, k=1+p.contrast/25, cut=p.cutoff/100;
        const field=(x,y)=>{
          let v=(Math.sin(x*fs+a1)+Math.cos(y*fs*1.1+a2)+Math.sin((x+y)*fs*0.6+a3))/3; // -1..1
          v=0.5+v*0.5; return clamp(0.5+(v-0.5)*k,0,1);
        };
        const gap=10*s;
        for(let y=pitch;y<H+pitch;y+=pitch){
          let x=0;
          while(x<W){
            const v=field(x,y);
            if(v<cut){ x+=TIERS[2].w*s+gap; continue; }
            const t=pickTier(v,0);
            seg(g,x,y,t,c);
            x+=t.w*s+gap;
          }
        }
      }
    },

    migration:{ label:"Tier migration", params:[
        {key:"pitch",   label:"Row pitch",     min:8,max:60,step:1,def:15},
        {key:"gap",     label:"Segment gap",   min:0,max:90,step:1,def:18},
        {key:"angle",   label:"Gradient angle",min:0,max:180,step:1,def:0},
        {key:"softness",label:"Softness",      min:0,max:100,step:1,def:30}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, s=c.scale, pitch=p.pitch*s, gap=p.gap*s;
        const ang=p.angle*Math.PI/180, dx=Math.cos(ang), dy=Math.sin(ang);
        const diag=Math.abs(W*dx)+Math.abs(H*dy)||1, soft=p.softness/100;
        for(let y=pitch;y<H+pitch;y+=pitch){
          let x=0;
          while(x<W){
            let frac=((x-W/2)*dx+(y-H/2)*dy)/diag+0.5;
            frac=clamp(frac+(rng()-0.5)*soft,0,1);
            const t=pickTier(frac,0);
            seg(g,x,y,t,c);
            x+=t.w*s+gap;
          }
        }
      }
    },

    flow:{ label:"Flow rows", params:[
        {key:"pitch",label:"Row pitch",     min:10,max:60,step:1,def:18},
        {key:"gap",  label:"Segment gap",   min:0,max:90,step:1,def:18},
        {key:"amp",  label:"Wave amplitude",min:0,max:140,step:1,def:34},
        {key:"freq", label:"Wave frequency",min:1,max:20,step:1,def:5},
        {key:"bias", label:"Weight bias",   min:-100,max:100,step:1,def:0}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, s=c.scale, pitch=p.pitch*s, gap=p.gap*s;
        const amp=p.amp*s, f=p.freq/1400, bias=p.bias/100;
        for(let y=pitch;y<H+pitch;y+=pitch){
          const ph=rng()*7; let x=0;
          while(x<W){
            const yy=y+amp*Math.sin(x*f+ph);
            const t=pickTier(rng(),bias);
            seg(g,x,yy,t,c);
            x+=t.w*s+gap;
          }
        }
      }
    }
  };

  /* ---- palettes drawn from the system's own tones ---- */
  const PALETTES=[
    {n:"Sage",  bg:"#212121", line:"#C6DDD3"},
    {n:"Panel", bg:"#383838", line:"#C6DDD3"},
    {n:"Cream", bg:"#212121", line:"#F2F0EA"},
    {n:"Mono",  bg:"#212121", line:"#EBEBEB"},
    {n:"Invert",bg:"#C6DDD3", line:"#212121"}
  ];
  const RATIOS=[
    {n:"16:9",w:1600,h:900},{n:"3:2",w:1500,h:1000},{n:"1:1",w:1200,h:1200},
    {n:"4:5",w:1080,h:1350},{n:"21:9",w:1680,h:720}
  ];

  const state={engine:"rows",seed:1042,scale:1,opacity:1,bg:"#212121",line:"#C6DDD3",W:1600,H:900,p:{}};
  const svg=document.getElementById("art");

  /* engine buttons */
  const engEl=document.getElementById("engines");
  Object.keys(ENGINES).forEach(key=>{
    const b=document.createElement("button");
    b.className="eng"+(key===state.engine?" on":"");
    b.textContent=ENGINES[key].label; b.dataset.key=key;
    b.addEventListener("click",()=>{state.engine=key;
      [...engEl.children].forEach(c=>c.classList.toggle("on",c.dataset.key===key));
      buildParams();render();});
    engEl.appendChild(b);
  });

  /* per-engine params */
  const paramsEl=document.getElementById("engineParams");
  function buildParams(){
    paramsEl.innerHTML=""; state.p={};
    ENGINES[state.engine].params.forEach(def=>{
      state.p[def.key]=def.def;
      const wrap=document.createElement("div");wrap.className="ctl";
      const lab=document.createElement("label");
      const span=document.createElement("span");span.className="val";span.textContent=def.def;
      lab.textContent=def.label+" ";lab.appendChild(span);
      const inp=document.createElement("input");
      inp.type="range";inp.min=def.min;inp.max=def.max;inp.step=def.step;inp.value=def.def;
      inp.addEventListener("input",()=>{const v=parseFloat(inp.value);state.p[def.key]=v;
        span.textContent=v;render();});
      wrap.appendChild(lab);wrap.appendChild(inp);paramsEl.appendChild(wrap);
    });
  }

  /* tier legend (visual proof of the locked grammar) */
  function buildLegend(){
    const L=document.getElementById("legend");L.innerHTML="";
    TIERS.forEach(t=>{
      const row=document.createElement("div");row.className="lgrow";
      const bar=document.createElement("div");bar.className="lgbar";
      bar.style.width=Math.round(t.w*0.5)+"px";bar.style.height=Math.max(2,Math.round(t.h))+"px";
      bar.style.background=state.line;
      const lab=document.createElement("span");
      lab.textContent=t.key+"  ·  "+t.w+"×"+t.h;
      row.appendChild(bar);row.appendChild(lab);L.appendChild(row);
    });
  }

  /* palette swatches */
  const swEl=document.getElementById("swatches");
  PALETTES.forEach((pal,i)=>{
    const sdiv=document.createElement("div");sdiv.className="sw"+(i===0?" on":"");
    sdiv.style.background=pal.bg;sdiv.title=pal.n;
    const sp=document.createElement("span");sp.textContent="≡";sp.style.color=pal.line;
    sdiv.appendChild(sp);
    sdiv.addEventListener("click",()=>{state.bg=pal.bg;state.line=pal.line;
      document.getElementById("bg").value=pal.bg;document.getElementById("line").value=pal.line;
      [...swEl.children].forEach((c,j)=>c.classList.toggle("on",j===i));
      buildLegend();render();});
    swEl.appendChild(sdiv);
  });

  /* ratios */
  const ratEl=document.getElementById("ratios");
  RATIOS.forEach((r,i)=>{
    const b=document.createElement("button");b.className="rt"+(i===0?" on":"");b.textContent=r.n;
    b.addEventListener("click",()=>{state.W=r.w;state.H=r.h;
      [...ratEl.children].forEach(c=>c.classList.toggle("on",c===b));render();});
    ratEl.appendChild(b);
  });

  /* simple controls */
  const seedInp=document.getElementById("seed");
  seedInp.addEventListener("input",()=>{state.seed=parseInt(seedInp.value||"0",10)||0;render();});
  document.getElementById("shuffle").addEventListener("click",()=>{
    state.seed=Math.floor(Math.random()*99999);seedInp.value=state.seed;render();});
  function bindRange(id,key,fmt){const inp=document.getElementById(id),out=document.getElementById("v"+id);
    const upd=()=>{state[key]=parseFloat(inp.value);out.textContent=fmt(state[key]);};
    inp.addEventListener("input",()=>{upd();render();});upd();}
  bindRange("scale","scale",v=>v.toFixed(2)+"×");
  bindRange("opacity","opacity",v=>v.toFixed(2));
  document.getElementById("bg").addEventListener("input",e=>{state.bg=e.target.value;clearSwatch();render();});
  document.getElementById("line").addEventListener("input",e=>{state.line=e.target.value;clearSwatch();buildLegend();render();});
  function clearSwatch(){[...swEl.children].forEach(c=>c.classList.remove("on"));}

  /* render */
  function render(){
    const {W,H}=state;
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("width",W);svg.setAttribute("height",H);
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    el(svg,"rect",{x:0,y:0,width:W,height:H,fill:state.bg});
    const g=el(svg,"g",{});
    const ctx={W,H,rng:makeRng(state.seed),color:state.line,scale:state.scale,opacity:state.opacity,p:state.p};
    ENGINES[state.engine].draw(g,ctx);
    const ps=Object.entries(state.p).map(([k,v])=>k+":"+v).join(" · ");
    document.getElementById("readout").innerHTML="<b>"+state.engine+"</b> · seed "+state.seed+" · "+ps+" · "+svg.querySelectorAll("rect").length+" segs";
    document.getElementById("dims").textContent=state.W+" × "+state.H+" px";
  }

  /* export — explicit rects, self-contained */
  function svgString(){const c=svg.cloneNode(true);c.setAttribute("xmlns",NS);
    c.setAttribute("width",state.W);c.setAttribute("height",state.H);
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c);}
  function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);}
  const fname=ext=>"yasp_pattern_"+state.engine+"_"+state.seed+"."+ext;
  document.getElementById("dlsvg").addEventListener("click",()=>
    download(new Blob([svgString()],{type:"image/svg+xml"}),fname("svg")));
  document.getElementById("dlpng").addEventListener("click",()=>{
    const s=svgString(),blob=new Blob([s],{type:"image/svg+xml"}),url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{const sc=2,cv=document.createElement("canvas");cv.width=state.W*sc;cv.height=state.H*sc;
      const cx=cv.getContext("2d");cx.scale(sc,sc);cx.drawImage(img,0,0);
      cv.toBlob(b=>{download(b,fname("png"));URL.revokeObjectURL(url);},"image/png");};
    img.onerror=()=>{URL.revokeObjectURL(url);alert("PNG export failed — SVG export still works.");};
    img.src=url;});

  /* init */
  buildParams();buildLegend();render();
})();
</script>
</body>
</html>
