  text{font-family:var(--mono)}

<script>
  function resolvedSVG(){
    const src=document.getElementById('art'), clone=src.cloneNode(true), cs=getComputedStyle(document.documentElement);
    const map={'--paper':'','--page':'','--ink':'','--ink-soft':'','--muted':'','--hair':'','--blue':''};
    for(const k in map) map[k]=cs.getPropertyValue(k).trim();
    let s=new XMLSerializer().serializeToString(clone);
    for(const k in map) s=s.replaceAll('var('+k+')',map[k]);
    return s;
  }
  function dl(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
  document.getElementById('svg').onclick=()=>dl('yasp-bridge-00d.svg',new Blob([resolvedSVG()],{type:'image/svg+xml'}));
  document.getElementById('png').onclick=()=>{
    const svg=resolvedSVG(),scale=2,img=new Image(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    img.onload=()=>{const c=document.createElement('canvas');c.width=1600*scale;c.height=1040*scale;const x=c.getContext('2d');x.scale(scale,scale);x.drawImage(img,0,0,1600,1040);URL.revokeObjectURL(url);c.toBlob(b=>dl('yasp-bridge-00d.png',b),'image/png');};
    img.src=url;
  };
</script>
