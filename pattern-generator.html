<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern v7 Generator</title>
<style>
  :root{
    --bg:#0B0B0C; --panel:#111113; --line:#1C1C20; --line2:#2A2A30;
    --fg:#EFE9DC; --mut:#8C887E; --dim:#5A574F; --accent:#C6DDD3;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;
    line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    height:100vh;overflow:hidden}
  header{display:flex;align-items:baseline;gap:14px;padding:14px 20px;
    border-bottom:1px solid var(--line);flex:0 0 auto}
  header h1{font-size:14px;font-weight:600;letter-spacing:.02em}
  header .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  header .lock{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--bg);background:var(--accent);padding:2px 7px;border-radius:3px;margin-left:auto}
  .app{flex:1 1 auto;display:flex;min-height:0}
  aside{width:300px;flex:0 0 auto;border-right:1px solid var(--line);overflow-y:auto;
    padding:6px 0 40px;background:var(--panel)}
  aside::-webkit-scrollbar{width:9px}
  aside::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--panel)}
  .group{padding:14px 18px;border-bottom:1px solid var(--line)}
  .group h2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mut);margin-bottom:12px;font-weight:500}
  .ctl{margin-bottom:13px} .ctl:last-child{margin-bottom:2px}
  .ctl label{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:11px;color:var(--fg);margin-bottom:6px}
  .ctl label .val{color:var(--mut)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;
    background:var(--line2);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--fg);cursor:pointer;border:2px solid var(--panel)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
    background:var(--fg);cursor:pointer;border:2px solid var(--panel)}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent)}

  .variants{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .var{font-family:var(--mono);font-size:10.5px;text-align:left;padding:8px 9px;
    border:1px solid var(--line2);background:transparent;color:var(--mut);border-radius:4px;
    cursor:pointer;transition:.12s;line-height:1.2}
  .var small{display:block;color:var(--dim);font-size:9px;margin-top:2px}
  .var:hover{border-color:var(--dim);color:var(--fg)}
  .var.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .var.on small{color:var(--bg)}
  .var:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .seg{display:flex;gap:5px}
  .seg button{flex:1;font-family:var(--mono);font-size:10px;padding:6px 4px;border:1px solid var(--line2);
    background:transparent;color:var(--mut);border-radius:4px;cursor:pointer}
  .seg button:hover{color:var(--fg);border-color:var(--dim)}
  .seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

  .seedrow{display:flex;gap:8px;align-items:center}
  .seedrow input[type=number]{flex:1;background:var(--bg);border:1px solid var(--line2);
    color:var(--fg);font-family:var(--mono);font-size:12px;padding:7px 9px;border-radius:4px;width:100%}
  .seedrow input[type=number]:focus{outline:none;border-color:var(--dim)}
  button.act{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:8px 12px;
    border:1px solid var(--line2);background:transparent;color:var(--fg);border-radius:4px;
    cursor:pointer;transition:.12s;white-space:nowrap}
  button.act:hover{border-color:var(--fg)}

  .legend{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .lgrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;color:var(--mut)}
  .lgbar{flex:0 0 auto}

  .swatches{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .sw{width:30px;height:30px;border-radius:4px;cursor:pointer;border:1px solid var(--line2);
    position:relative;overflow:hidden}
  .sw.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
  .sw.none{background:repeating-conic-gradient(#3a3a3a 0% 25%,#222 0% 50%) 50%/10px 10px}
  .sw span{position:absolute;left:5px;right:5px;top:50%;transform:translateY(-50%);height:3px;border-radius:1px}
  .colrow{display:flex;gap:10px}.colrow .cc{flex:1}
  .colrow label{font-family:var(--mono);font-size:10px;color:var(--mut);display:block;
    margin-bottom:5px;letter-spacing:.06em}
  .colrow input[type=color]{width:100%;height:30px;border:1px solid var(--line2);
    background:var(--bg);border-radius:4px;cursor:pointer;padding:2px}

  .ratios{display:flex;gap:6px;flex-wrap:wrap}
  .rt{font-family:var(--mono);font-size:10px;padding:6px 9px;border:1px solid var(--line2);
    background:transparent;color:var(--mut);border-radius:4px;cursor:pointer}
  .rt:hover{color:var(--fg);border-color:var(--dim)}
  .rt.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}.exports button{padding:10px}

  main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:#08080A}
  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:28px;
    min-height:0;overflow:hidden;
    background-image:repeating-conic-gradient(#101012 0% 25%,#0a0a0b 0% 50%);background-size:22px 22px}
  .frame{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5);line-height:0}
  .frame svg{display:block;max-width:100%;max-height:calc(100vh - 160px);width:auto;height:auto}
  .statusbar{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 20px;display:flex;
    justify-content:space-between;align-items:center;gap:16px;background:var(--bg)}
  .readout{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .readout b{color:var(--mut);font-weight:500}
  .dims{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
  @media(max-width:780px){body{overflow:auto;height:auto}.app{flex-direction:column}
    aside{width:100%;border-right:none;border-bottom:1px solid var(--line)}.frame svg{max-height:60vh}}
</style>
</head>
<body>
<header>
  <h1>Pattern v7 Generator</h1>
  <span class="tag">column rhythm · phase-offset</span>
  <span class="lock">grammar-locked</span>
</header>

<div class="app">
  <aside>
    <div class="group">
      <h2>Variant</h2>
      <div class="variants" id="variants"></div>
    </div>

    <div class="group">
      <h2>Seed</h2>
      <div class="seedrow">
        <input type="number" id="seed" value="1042" min="0" step="1" aria-label="Seed">
        <button class="act" id="shuffle">Shuffle</button>
      </div>
    </div>

    <div class="group">
      <h2>Rhythm</h2>
      <div class="ctl"><label>Density <span class="val" id="vdensity"></span></label>
        <input type="range" id="density" min="1" max="16" step="1" value="6"></div>
      <div class="ctl"><label>Spread <span class="val" id="vspread"></span></label>
        <input type="range" id="spread" min="0" max="100" step="1" value="50"></div>
      <div class="ctl"><label>Variation <span class="val" id="vvariation"></span></label>
        <input type="range" id="variation" min="0" max="100" step="1" value="0"></div>
      <div class="ctl"><label>Row pitch <span class="val" id="vpitch"></span></label>
        <input type="range" id="pitch" min="30" max="120" step="1" value="72"></div>
    </div>

    <div class="group">
      <h2>Placement</h2>
      <div class="ctl"><label>Anchor</label><div class="seg" id="anchor"></div></div>
      <div class="ctl"><label>Tile</label><div class="seg" id="tile"></div></div>
      <div class="ctl"><label>Align</label><div class="seg" id="align"></div></div>
    </div>

    <div class="group">
      <h2>Falloff <span class="val" style="font-family:var(--mono);font-size:9px;color:var(--dim)">for the applied look</span></h2>
      <div class="ctl"><label>Fade <span class="val" id="vfade"></span></label>
        <input type="range" id="fade" min="0" max="100" step="1" value="0"></div>
      <div class="ctl"><label>Direction</label><div class="seg" id="fadeDir"></div></div>
    </div>

    <div class="group">
      <h2>System unit</h2>
      <div class="ctl"><label>Scale <span class="val" id="vscale"></span></label>
        <input type="range" id="scale" min="0.3" max="2.2" step="0.05" value="1"></div>
      <div class="ctl"><label>Opacity <span class="val" id="vopacity"></span></label>
        <input type="range" id="opacity" min="0.2" max="1" step="0.02" value="1"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="group">
      <h2>Palette</h2>
      <div class="swatches" id="swatches"></div>
      <div class="colrow">
        <div class="cc"><label>Ground</label><input type="color" id="bg" value="#191919"></div>
        <div class="cc"><label>Bar</label><input type="color" id="line" value="#C6DDD3"></div>
      </div>
    </div>

    <div class="group">
      <h2>Canvas</h2>
      <div class="ratios" id="ratios"></div>
    </div>

    <div class="group">
      <h2>Export</h2>
      <div class="exports"><button class="act" id="dlsvg">SVG</button><button class="act" id="dlpng">PNG</button></div>
    </div>
  </aside>

  <main>
    <div class="stage"><div class="frame"><svg id="art" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
    <div class="statusbar"><div class="readout" id="readout"></div><div class="dims" id="dims"></div></div>
  </main>
</div>

<script>
(function(){
  "use strict";
  const NS="http://www.w3.org/2000/svg";

  /* Pattern v7 grammar (from the application SVGs):
     three bar types, height halves / width grows, constant row pitch.
     Each column = one type; bars left-aligned; columns edge-to-edge;
     counts vary per type, centred on a shared axis -> phase-offset rhythm. */
  const TYPES={ a:{w:170,h:16}, g:{w:340,h:8}, b:{w:440,h:4} };
  const ORDER={a:0,g:1,b:2};

  function makeRng(seed){let s=seed>>>0;return function(){s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;};}
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  function el(p,tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}

  const VARIANTS={
    recreation:{label:"Recreation",note:"4-col · A·B·A·C",seq:["a","g","a","b"],
      d:{density:6,spread:50,variation:0,anchor:"center",tile:"1",align:"center"}},
    minimal:{label:"Minimal three",note:"one per type",seq:["a","g","b"],
      d:{density:4,spread:40,variation:0,anchor:"center",tile:"1",align:"center"}},
    hero:{label:"Hero band",note:"6-col · tiled",seq:["a","g","a","b","g","b"],
      d:{density:8,spread:70,variation:18,anchor:"center",tile:"fill",align:"left"}},
    slim:{label:"Slim section",note:"low · bottom",seq:["a","g","b"],
      d:{density:3,spread:30,variation:0,anchor:"bottom",tile:"1",align:"center"}},
    card:{label:"Stat corner",note:"bottom-right",seq:["a","g","a","b"],
      d:{density:6,spread:60,variation:10,anchor:"bottom",tile:"1",align:"right"}},
    logomark:{label:"Logomark",note:"count = 1",seq:["a","g","b"],
      d:{density:1,spread:0,variation:0,anchor:"center",tile:"1",align:"center"}}
  };

  // flat grounds + gradient + transparent (no Figma constraint -> richer SVG)
  const PALETTES=[
    {n:"Sage",  bg:"#191919", line:"#C6DDD3"},
    {n:"Mist",  bg:"#191919", line:"#FAF8F4"},
    {n:"Invert",bg:"#FAF8F4", line:"#191919"},
    {n:"Forest",bg:"#1C4A45", line:"#C6DDD3", grad:["#1C4A45","#0E211C"]},
    {n:"Coral", bg:"#191919", line:"#E77958"},
    {n:"Panel", bg:"#383838", line:"#C6DDD3"},
    {n:"None",  bg:null,      line:"#C6DDD3", transparent:true}
  ];
  const RATIOS=[
    {n:"16:9",w:1600,h:900},{n:"21:9",w:1680,h:720},{n:"1:1",w:1200,h:1200},
    {n:"4:5",w:1080,h:1350},{n:"band",w:2400,h:600}
  ];

  const state={variant:"recreation",seq:VARIANTS.recreation.seq.slice(),
    density:6,spread:50,variation:0,pitch:72,anchor:"center",tile:"1",align:"center",
    fade:0,fadeDir:"right",
    scale:1,opacity:1,bg:"#191919",line:"#C6DDD3",grad:null,transparent:false,
    W:1600,H:900,seed:1042};
  const svg=document.getElementById("art");
  const sliders={}, segs={};

  function countFor(typeKey){
    const idx=ORDER[typeKey];
    const off=Math.round(Math.pow(idx,1.585)*state.spread/50); // 0,1,3 at spread 50
    return Math.max(1, state.density+off);
  }
  // opacity falloff across the frame, for the applied (over-image / corner) look
  function fadeFactor(xc){
    if(!state.fade) return 1;
    const px=clamp(xc/state.W,0,1), amt=state.fade/100*1.25;
    let f=1;
    if(state.fadeDir==="right") f=1-px*amt;
    else if(state.fadeDir==="left") f=1-(1-px)*amt;
    else f=1-(Math.abs(px-0.5)*2)*amt;     // edges
    return clamp(f,0,1);
  }

  function render(){
    const {W,H}=state, s=state.scale, P=state.pitch*s;
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("width",W); svg.setAttribute("height",H);
    while(svg.firstChild) svg.removeChild(svg.firstChild);

    // ground: gradient / flat / transparent
    if(state.grad){
      const defs=el(svg,"defs",{});
      const lg=el(defs,"linearGradient",{id:"bgGrad",x1:"0",y1:"0",x2:"0",y2:"1"});
      el(lg,"stop",{offset:"0","stop-color":state.grad[0]});
      el(lg,"stop",{offset:"1","stop-color":state.grad[1]});
      el(svg,"rect",{x:0,y:0,width:W,height:H,fill:"url(#bgGrad)"});
    } else if(!state.transparent && state.bg){
      el(svg,"rect",{x:0,y:0,width:W,height:H,fill:state.bg});
    } // transparent -> no ground rect

    const g=el(svg,"g",{});
    const rng=makeRng(state.seed);

    const modW=state.seq.reduce((a,k)=>a+TYPES[k].w*s,0);
    let reps=1;
    if(state.tile==="2")reps=2; else if(state.tile==="4")reps=4;
    else if(state.tile==="fill")reps=Math.max(1,Math.ceil(W/modW)+1);

    const columns=[];
    for(let r=0;r<reps;r++) for(const k of state.seq) columns.push(k);
    const totalW=columns.reduce((a,k)=>a+TYPES[k].w*s,0);
    let x = state.align==="left"?0 : state.align==="right"?(W-totalW) : (W-totalW)/2;

    for(const k of columns){
      const t=TYPES[k], w=t.w*s, h=t.h*s;
      let cnt=countFor(k);
      const j=Math.round((rng()-0.5)*2*state.variation/100*(state.density*0.5+1));
      cnt=Math.max(1,cnt+j);
      const span=(cnt-1)*P;
      // Bars centre on ONE shared pitch grid (independent of bar thickness),
      // so thick and thin bars line up row-for-row across every column.
      let firstCY = state.anchor==="center" ? H/2-span/2
                  : state.anchor==="top"    ? P*0.5
                  :                            (H-P*0.5)-span;   // bottom: shared baseline
      const op=clamp(state.opacity*fadeFactor(x+w/2),0,1);
      if(op>0.003){
        for(let i=0;i<cnt;i++){
          const cy=firstCY+i*P;
          el(g,"rect",{x:x.toFixed(2),y:(cy-h/2).toFixed(2),width:w.toFixed(2),height:h.toFixed(2),
            fill:state.line,"fill-opacity":op.toFixed(3),"shape-rendering":"crispEdges"});
        }
      }
      x+=w;
    }
    const segc=svg.querySelectorAll("g rect").length;
    document.getElementById("readout").innerHTML="<b>"+state.variant+"</b> · seed "+state.seed+
      " · density "+state.density+" · spread "+state.spread+
      (state.fade?" · fade "+state.fade+state.fadeDir.charAt(0):"")+" · tile "+state.tile+" · "+segc+" bars";
    document.getElementById("dims").textContent=state.W+" × "+state.H+" px"+(state.transparent?" · transparent":"");
  }

  /* variant buttons */
  const varEl=document.getElementById("variants");
  Object.keys(VARIANTS).forEach(key=>{
    const v=VARIANTS[key];
    const b=document.createElement("button"); b.className="var"+(key===state.variant?" on":""); b.dataset.key=key;
    b.innerHTML=v.label+"<small>"+v.note+"</small>";
    b.addEventListener("click",()=>applyVariant(key));
    varEl.appendChild(b);
  });
  function applyVariant(key){
    const v=VARIANTS[key];
    state.variant=key; state.seq=v.seq.slice();
    Object.assign(state,v.d);
    [...varEl.children].forEach(c=>c.classList.toggle("on",c.dataset.key===key));
    syncUI(); render();
  }

  /* sliders */
  function bindSlider(id,key,fmt){
    const inp=document.getElementById(id), out=document.getElementById("v"+id);
    sliders[id]={inp,out,fmt,key};
    const upd=()=>{state[key]=parseFloat(inp.value);out.textContent=fmt(state[key]);};
    inp.addEventListener("input",()=>{upd();render();}); upd();
  }
  bindSlider("density","density",v=>v);
  bindSlider("spread","spread",v=>v);
  bindSlider("variation","variation",v=>v);
  bindSlider("pitch","pitch",v=>v+"px");
  bindSlider("fade","fade",v=>v?v+"%":"off");
  bindSlider("scale","scale",v=>v.toFixed(2)+"×");
  bindSlider("opacity","opacity",v=>v.toFixed(2));

  /* segmented controls */
  function buildSeg(id,key,opts){
    const host=document.getElementById(id); segs[id]={host,key};
    opts.forEach(o=>{
      const b=document.createElement("button"); b.textContent=o.label; b.dataset.v=o.v;
      b.className=(String(state[key])===o.v?"on":"");
      b.addEventListener("click",()=>{state[key]=o.v;
        [...host.children].forEach(c=>c.classList.toggle("on",c.dataset.v===o.v));render();});
      host.appendChild(b);
    });
  }
  buildSeg("anchor","anchor",[{v:"center",label:"Center"},{v:"bottom",label:"Bottom"},{v:"top",label:"Top"}]);
  buildSeg("tile","tile",[{v:"1",label:"1×"},{v:"2",label:"2×"},{v:"4",label:"4×"},{v:"fill",label:"Fill"}]);
  buildSeg("align","align",[{v:"left",label:"Left"},{v:"center",label:"Center"},{v:"right",label:"Right"}]);
  buildSeg("fadeDir","fadeDir",[{v:"right",label:"→ fade"},{v:"left",label:"fade ←"},{v:"edges",label:"Edges"}]);

  function syncUI(){
    for(const id in sliders){const sl=sliders[id];sl.inp.value=state[sl.key];sl.out.textContent=sl.fmt(state[sl.key]);}
    for(const id in segs){const sg=segs[id];
      [...sg.host.children].forEach(c=>c.classList.toggle("on",c.dataset.v===String(state[sg.key])));}
  }

  /* legend */
  function buildLegend(){
    const L=document.getElementById("legend"); L.innerHTML="";
    [["a","α"],["g","γ"],["b","β"]].forEach(([k,sym])=>{
      const t=TYPES[k], row=document.createElement("div"); row.className="lgrow";
      const bar=document.createElement("div"); bar.className="lgbar";
      bar.style.width=Math.round(t.w*0.28)+"px"; bar.style.height=Math.max(2,Math.round(t.h*0.7))+"px";
      bar.style.background=(state.transparent||state.grad)?"#C6DDD3":state.line;
      const lab=document.createElement("span"); lab.textContent=sym+"  ·  "+t.w+"×"+t.h;
      row.appendChild(bar); row.appendChild(lab); L.appendChild(row);
    });
  }

  /* palette */
  const swEl=document.getElementById("swatches");
  PALETTES.forEach((pal,i)=>{
    const sdiv=document.createElement("div");
    const isOn=(pal.transparent&&state.transparent)||(!pal.transparent&&pal.bg===state.bg&&pal.line===state.line);
    sdiv.className="sw"+(pal.transparent?" none":"")+(isOn?" on":"");
    if(!pal.transparent) sdiv.style.background=pal.grad?("linear-gradient(#1C4A45,#0E211C)"):pal.bg;
    sdiv.title=pal.n;
    const sp=document.createElement("span"); sp.style.background=pal.line; sdiv.appendChild(sp);
    sdiv.addEventListener("click",()=>{
      state.transparent=!!pal.transparent; state.grad=pal.grad||null;
      state.bg=pal.bg; state.line=pal.line;
      if(pal.bg) document.getElementById("bg").value=pal.bg;
      document.getElementById("line").value=pal.line;
      [...swEl.children].forEach((c,j)=>c.classList.toggle("on",j===i));
      buildLegend();render();
    });
    swEl.appendChild(sdiv);
  });
  document.getElementById("bg").addEventListener("input",e=>{state.bg=e.target.value;state.grad=null;state.transparent=false;clearSw();render();});
  document.getElementById("line").addEventListener("input",e=>{state.line=e.target.value;clearSw();buildLegend();render();});
  function clearSw(){[...swEl.children].forEach(c=>c.classList.remove("on"));}

  /* ratios */
  const ratEl=document.getElementById("ratios");
  RATIOS.forEach((r,i)=>{
    const b=document.createElement("button"); b.className="rt"+(i===0?" on":""); b.textContent=r.n;
    b.addEventListener("click",()=>{state.W=r.w;state.H=r.h;
      [...ratEl.children].forEach(c=>c.classList.toggle("on",c===b));render();});
    ratEl.appendChild(b);
  });

  /* seed */
  const seedInp=document.getElementById("seed");
  seedInp.addEventListener("input",()=>{state.seed=parseInt(seedInp.value||"0",10)||0;render();});
  document.getElementById("shuffle").addEventListener("click",()=>{
    state.seed=Math.floor(Math.random()*99999);seedInp.value=state.seed;render();});

  /* export */
  function svgString(){const c=svg.cloneNode(true);c.setAttribute("xmlns",NS);
    c.setAttribute("width",state.W);c.setAttribute("height",state.H);
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c);}
  function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);}
  const fname=ext=>"yasp_patternv7_"+state.variant+"_"+state.seed+(state.transparent?"_transparent":"")+"."+ext;
  document.getElementById("dlsvg").addEventListener("click",()=>
    download(new Blob([svgString()],{type:"image/svg+xml"}),fname("svg")));
  document.getElementById("dlpng").addEventListener("click",()=>{
    const s=svgString(),blob=new Blob([s],{type:"image/svg+xml"}),url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{const sc=2,cv=document.createElement("canvas");cv.width=state.W*sc;cv.height=state.H*sc;
      const cx=cv.getContext("2d");cx.scale(sc,sc);cx.drawImage(img,0,0);   // transparent ground -> alpha PNG
      cv.toBlob(b=>{download(b,fname("png"));URL.revokeObjectURL(url);},"image/png");};
    img.onerror=()=>{URL.revokeObjectURL(url);alert("PNG export failed — SVG export still works.");};
    img.src=url;});

  /* init */
  buildLegend(); syncUI(); render();
})();
</script>
</body>
</html>
