<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Studio — line-art generator</title>
<style>
  :root{
    --bg:#0B0B0C; --panel:#111113; --line:#1C1C20; --line2:#2A2A30;
    --fg:#EFE9DC; --mut:#8C887E; --dim:#5A574F; --accent:#C9462C;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);font-family:var(--sans);
    font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  header{
    display:flex;align-items:baseline;gap:14px;
    padding:14px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  header h1{font-size:14px;font-weight:600;letter-spacing:.02em}
  header .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  .app{flex:1 1 auto;display:flex;min-height:0}

  /* controls */
  aside{
    width:300px;flex:0 0 auto;border-right:1px solid var(--line);
    overflow-y:auto;padding:6px 0 40px;background:var(--panel);
  }
  aside::-webkit-scrollbar{width:9px}
  aside::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--panel)}
  .group{padding:14px 18px;border-bottom:1px solid var(--line)}
  .group h2{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mut);margin-bottom:12px;font-weight:500}
  .ctl{margin-bottom:13px}
  .ctl:last-child{margin-bottom:2px}
  .ctl label{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:11px;color:var(--fg);margin-bottom:6px}
  .ctl label .val{color:var(--mut)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;
    background:var(--line2);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
    border-radius:50%;background:var(--fg);cursor:pointer;border:2px solid var(--panel)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
    background:var(--fg);cursor:pointer;border:2px solid var(--panel)}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent)}

  .engines{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .eng{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;text-align:left;
    padding:8px 9px;border:1px solid var(--line2);background:transparent;color:var(--mut);
    border-radius:4px;cursor:pointer;transition:.12s;line-height:1.25}
  .eng:hover{border-color:var(--dim);color:var(--fg)}
  .eng.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .eng:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .seedrow{display:flex;gap:8px;align-items:center}
  .seedrow input[type=number]{flex:1;background:var(--bg);border:1px solid var(--line2);
    color:var(--fg);font-family:var(--mono);font-size:12px;padding:7px 9px;border-radius:4px;width:100%}
  .seedrow input[type=number]:focus{outline:none;border-color:var(--dim)}
  button.act{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    padding:8px 12px;border:1px solid var(--line2);background:transparent;color:var(--fg);
    border-radius:4px;cursor:pointer;transition:.12s;white-space:nowrap}
  button.act:hover{border-color:var(--fg)}
  button.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .swatches{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .sw{width:30px;height:30px;border-radius:4px;cursor:pointer;border:1px solid var(--line2);
    position:relative;overflow:hidden}
  .sw.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
  .sw span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:13px;font-weight:600}
  .colrow{display:flex;gap:10px}
  .colrow .cc{flex:1}
  .colrow label{font-family:var(--mono);font-size:10px;color:var(--mut);
    display:block;margin-bottom:5px;letter-spacing:.06em}
  .colrow input[type=color]{width:100%;height:30px;border:1px solid var(--line2);
    background:var(--bg);border-radius:4px;cursor:pointer;padding:2px}

  .ratios{display:flex;gap:6px;flex-wrap:wrap}
  .rt{font-family:var(--mono);font-size:10px;padding:6px 9px;border:1px solid var(--line2);
    background:transparent;color:var(--mut);border-radius:4px;cursor:pointer}
  .rt:hover{color:var(--fg);border-color:var(--dim)}
  .rt.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

  .exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .exports button{padding:10px}

  /* stage */
  main{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:#08080A}
  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    padding:28px;min-height:0;overflow:hidden}
  .frame{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5);
    line-height:0}
  .frame svg{display:block;max-width:100%;max-height:calc(100vh - 160px);width:auto;height:auto}
  .statusbar{flex:0 0 auto;border-top:1px solid var(--line);padding:9px 20px;
    display:flex;justify-content:space-between;align-items:center;gap:16px}
  .readout{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .readout b{color:var(--mut);font-weight:500}
  .dims{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}

  @media(max-width:780px){
    body{overflow:auto;height:auto}
    .app{flex-direction:column}
    aside{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .frame svg{max-height:60vh}
  }
</style>
</head>
<body>
<header>
  <h1>Pattern Studio</h1>
  <span class="tag">parametric line-art · svg</span>
</header>

<div class="app">
  <aside id="panel">
    <div class="group">
      <h2>Engine</h2>
      <div class="engines" id="engines"></div>
    </div>

    <div class="group">
      <h2>Seed</h2>
      <div class="seedrow">
        <input type="number" id="seed" value="1042" min="0" step="1" aria-label="Seed value">
        <button class="act" id="shuffle">Shuffle</button>
      </div>
    </div>

    <div class="group">
      <h2>Composition</h2>
      <div id="engineParams"></div>
    </div>

    <div class="group">
      <h2>Stroke</h2>
      <div class="ctl">
        <label>Weight <span class="val" id="vweight"></span></label>
        <input type="range" id="weight" min="0.3" max="4" step="0.1" value="0.9">
      </div>
      <div class="ctl">
        <label>Opacity <span class="val" id="vopacity"></span></label>
        <input type="range" id="opacity" min="0.1" max="1" step="0.02" value="0.5">
      </div>
    </div>

    <div class="group">
      <h2>Palette</h2>
      <div class="swatches" id="swatches"></div>
      <div class="colrow">
        <div class="cc"><label>Background</label><input type="color" id="bg" value="#0B0B0C"></div>
        <div class="cc"><label>Line</label><input type="color" id="line" value="#EFE9DC"></div>
      </div>
    </div>

    <div class="group">
      <h2>Canvas</h2>
      <div class="ratios" id="ratios"></div>
    </div>

    <div class="group">
      <h2>Export</h2>
      <div class="exports">
        <button class="act" id="dlsvg">SVG</button>
        <button class="act" id="dlpng">PNG</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="stage">
      <div class="frame">
        <svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <div class="statusbar">
      <div class="readout" id="readout"></div>
      <div class="dims" id="dims"></div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";
  const NS="http://www.w3.org/2000/svg";

  /* ---------- seeded RNG (mulberry32) ---------- */
  function makeRng(seed){
    let s = seed>>>0;
    return function(){
      s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s>>>15, 1 | s);
      t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
      return ((t ^ t>>>14)>>>0) / 4294967296;
    };
  }

  /* ---------- svg helpers ---------- */
  function el(parent,tag,attrs){
    const e=document.createElementNS(NS,tag);
    for(const k in attrs) e.setAttribute(k,attrs[k]);
    parent.appendChild(e); return e;
  }
  function stroke(e,ctx){
    e.style.stroke=ctx.color; e.setAttribute("fill","none");
    e.setAttribute("stroke-width",ctx.weight);
    e.setAttribute("stroke-opacity",ctx.opacity);
    e.setAttribute("stroke-linecap","round");
    e.setAttribute("stroke-linejoin","round");
    return e;
  }
  function pathd(g,d,ctx){ const e=el(g,"path",{d}); return stroke(e,ctx); }
  function lineEl(g,x1,y1,x2,y2,ctx){
    const e=el(g,"line",{x1:x1.toFixed(1),y1:y1.toFixed(1),x2:x2.toFixed(1),y2:y2.toFixed(1)});
    return stroke(e,ctx);
  }

  /* ---------- engines ----------
     each: { label, params:[{key,label,min,max,step,def}], draw(g,ctx) }
     ctx = { W,H, rng, color, weight, opacity, p:{...} }
  ------------------------------------------------*/
  const ENGINES = {

    flow:{ label:"Fields & flow", params:[
        {key:"spacing",label:"Line spacing",min:14,max:70,step:1,def:30},
        {key:"length", label:"Streamline length",min:10,max:160,step:2,def:64},
        {key:"field",  label:"Field scale",min:2,max:40,step:1,def:9}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, sp=p.spacing, steps=p.length, fs=p.field/1000;
        const a1=rng()*9, a2=rng()*9, a3=rng()*9;
        const ang=(x,y)=>(Math.sin(x*fs+a1)+Math.cos(y*fs*1.13+a2)+Math.sin((x+y)*fs*0.6+a3))*1.5;
        for(let sx=sp*0.5;sx<W;sx+=sp) for(let sy=sp*0.5;sy<H;sy+=sp){
          let x=sx+(rng()-0.5)*sp*0.8, y=sy+(rng()-0.5)*sp*0.8;
          let d="M"+x.toFixed(1)+" "+y.toFixed(1);
          for(let i=0;i<steps;i++){ const a=ang(x,y); x+=Math.cos(a)*3.2; y+=Math.sin(a)*3.2;
            if(x<-20||x>W+20||y<-20||y>H+20)break; d+="L"+x.toFixed(1)+" "+y.toFixed(1); }
          pathd(g,d,c);
        }
      }
    },

    waves:{ label:"Wave interference", params:[
        {key:"sources",label:"Sources",min:1,max:9,step:1,def:4},
        {key:"spacing",label:"Ring spacing",min:12,max:90,step:1,def:30}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, n=p.sources, sp=p.spacing;
        const diag=Math.hypot(W,H), rings=Math.ceil(diag/sp);
        for(let i=0;i<n;i++){
          const cx=W*(0.12+rng()*0.76), cy=H*(0.12+rng()*0.76);
          for(let k=1;k<=rings;k++){
            const e=el(g,"circle",{cx:cx.toFixed(1),cy:cy.toFixed(1),r:(k*sp).toFixed(1)});
            stroke(e,c);
          }
        }
      }
    },

    phase:{ label:"Phase trajectories", params:[
        {key:"trajectories",label:"Trajectories",min:3,max:48,step:1,def:18},
        {key:"swirl",label:"Swirl",min:20,max:98,step:1,def:90},
        {key:"steps",label:"Trail length",min:80,max:480,step:10,def:260}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, cx=W/2, cy=H/2, decay=(100-p.swirl)/100*0.18+0.02, rot=p.swirl/100*0.95;
        for(let t=0;t<p.trajectories;t++){
          let x=W*(0.05+rng()*0.9), y=H*(0.05+rng()*0.9);
          let d="M"+x.toFixed(1)+" "+y.toFixed(1);
          for(let i=0;i<p.steps;i++){
            const px=x-cx, py=y-cy;
            const vx=-py*rot-px*decay, vy=px*rot-py*decay;
            x+=vx*0.02; y+=vy*0.02; d+="L"+x.toFixed(1)+" "+y.toFixed(1);
          }
          pathd(g,d,c);
        }
      }
    },

    waveforms:{ label:"Stacked waveforms", params:[
        {key:"rows",label:"Rows",min:4,max:60,step:1,def:22},
        {key:"amp",label:"Amplitude",min:2,max:60,step:1,def:18},
        {key:"detail",label:"Frequency",min:1,max:24,step:1,def:7}
      ],
      draw(g,c){
        const {W,H,rng,p}=c, gap=H/(p.rows+1);
        for(let r=0;r<p.rows;r++){
          const by=gap*(r+1);
          const f1=(0.3+rng()*0.5)*p.detail/1000, f2=(0.8+rng()*1.1)*p.detail/1000;
          const ph1=rng()*7, ph2=rng()*7, a1=p.amp*(0.5+rng()*0.5), a2=p.amp*(0.2+rng()*0.4);
          let d="";
          for(let x=0;x<=W;x+=3){
            const y=by+a1*Math.sin(x*f1+ph1)+a2*Math.sin(x*f2+ph2);
            d+=(x===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1);
          }
          pathd(g,d,c);
        }
      }
    },

    string:{ label:"String-art envelope", params:[
        {key:"points",label:"Points",min:30,max:480,step:2,def:180},
        {key:"mult",label:"Multiplier",min:2,max:12,step:1,def:2},
        {key:"size",label:"Radius",min:20,max:98,step:1,def:78}
      ],
      draw(g,c){
        const {W,H,p}=c, cx=W/2, cy=H/2, R=Math.min(W,H)*p.size/200, N=p.points, k=p.mult;
        const pt=i=>{const a=i/N*Math.PI*2; return [cx+R*Math.cos(a), cy+R*Math.sin(a)];};
        for(let i=0;i<N;i++){
          const a=pt(i), b=pt((i*k)%N);
          lineEl(g,a[0],a[1],b[0],b[1],c);
        }
      }
    },

    moire:{ label:"Moiré gratings", params:[
        {key:"spacing",label:"Line spacing",min:5,max:40,step:1,def:11},
        {key:"angle",label:"Offset angle",min:0.5,max:14,step:0.5,def:4},
        {key:"curve",label:"Curvature",min:0,max:40,step:1,def:0}
      ],
      draw(g,c){
        const {W,H,p}=c, sp=p.spacing, cv=p.curve/8, diag=Math.hypot(W,H);
        const fam=(th)=>{
          const st=Math.sin(th), ct=Math.cos(th);
          for(let off=-diag;off<diag;off+=sp){
            let d="";
            for(let s=-diag/2;s<=diag/2;s+=8){
              const warp=cv*Math.sin(s*0.01);
              const lx=off+warp, ly=s;
              const x=W/2 + lx*ct - ly*st;
              const y=H/2 + lx*st + ly*ct;
              d+=(d===""?"M":"L")+x.toFixed(1)+" "+y.toFixed(1);
            }
            pathd(g,d,c);
          }
        };
        const a=p.angle*Math.PI/180;
        fam(-a/2); fam(a/2);
      }
    },

    lissajous:{ label:"Lissajous matrix", params:[
        {key:"cols",label:"Columns",min:1,max:9,step:1,def:6},
        {key:"rows",label:"Rows",min:1,max:7,step:1,def:4},
        {key:"complexity",label:"Max frequency",min:2,max:9,step:1,def:5}
      ],
      draw(g,c){
        const {W,H,p}=c, cw=W/p.cols, ch=H/p.rows, mx=p.complexity;
        for(let ci=0;ci<p.cols;ci++) for(let ri=0;ri<p.rows;ri++){
          const ccx=cw*(ci+0.5), ccy=ch*(ri+0.5);
          const A=cw*0.36, B=ch*0.36;
          const a=1+(ci%mx), b=2+(ri%mx), de=(ci+ri)*0.34;
          let d="";
          for(let t=0;t<=Math.PI*2+0.04;t+=0.035){
            const x=ccx+A*Math.sin(a*t+de), y=ccy+B*Math.sin(b*t);
            d+=(t===0?"M":"L")+x.toFixed(1)+" "+y.toFixed(1);
          }
          pathd(g,d,c);
        }
      }
    }
  };

  /* ---------- palettes ---------- */
  const PALETTES=[
    {n:"Carbon",   bg:"#0B0B0C", line:"#EFE9DC"},
    {n:"Paper",    bg:"#F5F3EC", line:"#222024"},
    {n:"Pure",     bg:"#0B0B0C", line:"#FFFFFF"},
    {n:"Blueprint",bg:"#0C1B2A", line:"#8FB8E0"},
    {n:"Rust",     bg:"#14100E", line:"#C9462C"}
  ];

  /* ---------- ratios ---------- */
  const RATIOS=[
    {n:"16:9", w:1600, h:900},
    {n:"3:2",  w:1500, h:1000},
    {n:"1:1",  w:1200, h:1200},
    {n:"4:5",  w:1080, h:1350},
    {n:"21:9", w:1680, h:720}
  ];

  /* ---------- state ---------- */
  const state={
    engine:"flow", seed:1042, weight:0.9, opacity:0.5,
    bg:"#0B0B0C", line:"#EFE9DC", W:1600, H:900, p:{}
  };

  const svg=document.getElementById("art");

  /* ---------- build engine buttons ---------- */
  const engEl=document.getElementById("engines");
  Object.keys(ENGINES).forEach(key=>{
    const b=document.createElement("button");
    b.className="eng"+(key===state.engine?" on":"");
    b.textContent=ENGINES[key].label; b.dataset.key=key;
    b.addEventListener("click",()=>{
      state.engine=key;
      [...engEl.children].forEach(c=>c.classList.toggle("on",c.dataset.key===key));
      buildParams(); render();
    });
    engEl.appendChild(b);
  });

  /* ---------- build per-engine param sliders ---------- */
  const paramsEl=document.getElementById("engineParams");
  function buildParams(){
    paramsEl.innerHTML="";
    state.p={};
    ENGINES[state.engine].params.forEach(def=>{
      state.p[def.key]=def.def;
      const wrap=document.createElement("div"); wrap.className="ctl";
      const lab=document.createElement("label");
      const span=document.createElement("span"); span.className="val"; span.textContent=def.def;
      lab.textContent=def.label+" "; lab.appendChild(span);
      const inp=document.createElement("input");
      inp.type="range"; inp.min=def.min; inp.max=def.max; inp.step=def.step; inp.value=def.def;
      inp.addEventListener("input",()=>{
        const v=parseFloat(inp.value); state.p[def.key]=v;
        span.textContent=Number.isInteger(def.step)?v:v.toFixed(def.step<1?1:0);
        render();
      });
      wrap.appendChild(lab); wrap.appendChild(inp); paramsEl.appendChild(wrap);
    });
  }

  /* ---------- palette swatches ---------- */
  const swEl=document.getElementById("swatches");
  PALETTES.forEach((pal,i)=>{
    const s=document.createElement("div"); s.className="sw"+(i===0?" on":"");
    s.style.background=pal.bg; s.title=pal.n;
    const sp=document.createElement("span"); sp.textContent="Ag"; sp.style.color=pal.line;
    s.appendChild(sp);
    s.addEventListener("click",()=>{
      state.bg=pal.bg; state.line=pal.line;
      document.getElementById("bg").value=pal.bg;
      document.getElementById("line").value=pal.line;
      [...swEl.children].forEach((c,j)=>c.classList.toggle("on",j===i));
      render();
    });
    swEl.appendChild(s);
  });

  /* ---------- ratios ---------- */
  const ratEl=document.getElementById("ratios");
  RATIOS.forEach((r,i)=>{
    const b=document.createElement("button");
    b.className="rt"+(i===0?" on":""); b.textContent=r.n;
    b.addEventListener("click",()=>{
      state.W=r.w; state.H=r.h;
      [...ratEl.children].forEach(c=>c.classList.toggle("on",c===b));
      render();
    });
    ratEl.appendChild(b);
  });

  /* ---------- simple controls ---------- */
  const seedInp=document.getElementById("seed");
  seedInp.addEventListener("input",()=>{ state.seed=parseInt(seedInp.value||"0",10)||0; render(); });
  document.getElementById("shuffle").addEventListener("click",()=>{
    state.seed=Math.floor(Math.random()*99999); seedInp.value=state.seed; render();
  });
  function bindRange(id,key,fmt){
    const inp=document.getElementById(id), out=document.getElementById("v"+id);
    const upd=()=>{ state[key]=parseFloat(inp.value); out.textContent=fmt(state[key]); };
    inp.addEventListener("input",()=>{upd();render();}); upd();
  }
  bindRange("weight","weight",v=>v.toFixed(1));
  bindRange("opacity","opacity",v=>v.toFixed(2));
  document.getElementById("bg").addEventListener("input",e=>{state.bg=e.target.value;clearSwatch();render();});
  document.getElementById("line").addEventListener("input",e=>{state.line=e.target.value;clearSwatch();render();});
  function clearSwatch(){[...swEl.children].forEach(c=>c.classList.remove("on"));}

  /* ---------- render ---------- */
  function render(){
    const {W,H}=state;
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("width",W); svg.setAttribute("height",H);
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    el(svg,"rect",{x:0,y:0,width:W,height:H,fill:state.bg});
    const g=el(svg,"g",{});
    const ctx={ W,H, rng:makeRng(state.seed), color:state.line,
      weight:state.weight, opacity:state.opacity, p:state.p };
    ENGINES[state.engine].draw(g,ctx);
    updateReadout();
  }

  function updateReadout(){
    const ps=Object.entries(state.p).map(([k,v])=>k+":"+v).join(" · ");
    document.getElementById("readout").innerHTML=
      "<b>"+state.engine+"</b> · seed "+state.seed+" · "+ps;
    document.getElementById("dims").textContent=state.W+" × "+state.H+" px";
  }

  /* ---------- export ---------- */
  function svgString(){
    const c=svg.cloneNode(true);
    c.setAttribute("xmlns",NS);
    c.setAttribute("width",state.W); c.setAttribute("height",state.H);
    return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(c);
  }
  function download(blob,name){
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  function fname(ext){ return "pattern_"+state.engine+"_"+state.seed+"."+ext; }
  document.getElementById("dlsvg").addEventListener("click",()=>{
    download(new Blob([svgString()],{type:"image/svg+xml"}), fname("svg"));
  });
  document.getElementById("dlpng").addEventListener("click",()=>{
    const s=svgString(), blob=new Blob([s],{type:"image/svg+xml"}), url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=()=>{
      const sc=2, cv=document.createElement("canvas");
      cv.width=state.W*sc; cv.height=state.H*sc;
      const cx=cv.getContext("2d"); cx.scale(sc,sc); cx.drawImage(img,0,0);
      cv.toBlob(b=>{ download(b,fname("png")); URL.revokeObjectURL(url); },"image/png");
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); alert("PNG export failed — SVG export still works."); };
    img.src=url;
  });

  /* ---------- init ---------- */
  buildParams();
  render();
})();
</script>
</body>
</html>
