<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Cover Generator</title>
<style>
:root{--bg:#0B0C0E;--edge:#C9C9C2;--mesh:#E6E6DF;--dot:#DEDED6;--muted:#7C7B72;--line:#2A2C31;--txt:#CFCEC6;--accent:#2C30E6;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono)}
.app{min-height:100%;display:flex;flex-direction:column}
.toolbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.05em}
.brand{font-weight:600}.brand small{color:var(--muted);font-weight:400;letter-spacing:.14em;margin-left:8px}
.sp{flex:1}label{display:inline-flex;gap:6px;align-items:center;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;font-size:10.5px}
input[type=number]{width:66px}input[type=number],select{background:#0c0d10;border:1px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:12px;padding:6px 7px}
input[type=range]{accent-color:var(--accent);width:80px}input[type=checkbox]{accent-color:var(--accent)}
button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--txt);border:1px solid var(--line);padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--txt)}button.pri{border-color:var(--accent);color:#c9caff}button.pri:hover{background:var(--accent);color:#fff}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.stage svg{display:block;width:auto;height:auto;max-width:94vw;max-height:86vh;cursor:pointer}
.hint{font-size:10px;color:var(--muted);padding:0 16px 10px;letter-spacing:.05em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
</style></head><body>
<div class="app">
<div class="toolbar">
<span class="brand">yasp<small>DIAGRAM COVER GENERATOR</small></span><span class="sp"></span>
<label>Diagram <select id="scene">
<option value="platformless">Platformless</option>
<option value="fragmentation">The Problem</option>
<option value="kronos">Kronos</option>
<option value="gaia">Gaia</option>
<option value="together">Kronos + Gaia</option>
<option value="pipeline">Pipeline (end-to-end)</option>
<option value="proof">Proven on Silicon</option>
<option value="matrix">The Gap · The Matrix</option>
<option value="months">Benefit · Months → Hours</option>
<option value="cost">Benefit · Cut Costs</option>
<option value="nolockin">Benefit · No Lock-In</option>
<option value="freeeng">Benefit · Free Your Engineers</option>
<option value="auditable">Benefit · Auditable & Deterministic</option>
</select></label>
<label>Version <select id="variant"><option value="A">A · Exploded</option><option value="B">B · Slab</option><option value="C">C · Isometric</option></select></label>
<label>Seed <input id="seed" type="number" value="7"></label><button id="rnd">↻</button>
<label>Accent <select id="accent"><option value="#2C30E6">Yasp Blue</option><option value="#93A487">Sage</option><option value="#C98A4B">Copper</option><option value="#F0E8D8">Cream</option></select></label>
<label>Models <input id="m" type="range" min="3" max="9" value="6"></label>
<label>Targets <input id="nn" type="range" min="3" max="8" value="5"></label>
<label>Rotate <input id="az" type="range" min="-20" max="75" value="28"></label>
<label>Tilt <input id="el" type="range" min="6" max="48" value="16"></label>
<label>Line <input id="lw" type="range" min="0.4" max="2.6" step="0.1" value="1"></label>
<label>Text <input id="ts" type="range" min="0.6" max="2" step="0.1" value="1"></label>
<label><input id="labels" type="checkbox" checked> Labels</label>
<button id="svg">SVG</button><button id="png" class="pri">PNG</button>
</div>
<div class="stage" id="stage"></div>
<div class="hint">Click the image to open the copy panel, then press Cmd/Ctrl-C. Rotate/Tilt reset to each diagram's default when you switch. Open the saved file in a browser tab if a sandbox blocks downloads.</div></div>
<script>
// yasp — MULTI-DIAGRAM COVER GENERATOR. Shared branded toolkit; each scene = a unique structure.
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function hsl2hex(h,sa,l){sa/=100;l/=100;h=((h%360)+360)%360;const a=sa*Math.min(l,1-l);const k=n=>(n+h/30)%12;const fch=n=>{const c=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(255*c);};return '#'+((1<<24)+(fch(0)<<16)+(fch(8)<<8)+fch(4)).toString(16).slice(1);}
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],lerp:(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]};

const SCENE_LIST=['platformless','fragmentation','kronos','gaia','together','pipeline','proof','matrix','months','cost','nolockin','freeeng','auditable'];
const SCENE_NAME={platformless:'PLATFORMLESS',fragmentation:'THE PROBLEM',kronos:'KRONOS',gaia:'GAIA',together:'KRONOS + GAIA',pipeline:'THE PIPELINE',proof:'PROVEN ON SILICON',matrix:'THE GAP · THE MATRIX',months:'MONTHS → HOURS',cost:'CUT COSTS',nolockin:'NO LOCK-IN',freeeng:'FREE YOUR ENGINEERS',auditable:'AUDITABLE · DETERMINISTIC'};

function build(opts){
  opts=opts||{};
  const scene=opts.scene||'platformless';
  const variant=opts.variant||'A';
  const seed=opts.seed||7, rand=mulberry32(seed);
  const accent=opts.accent||'#2C30E6', labels=opts.labels!==false;
  const lw=opts.lineWeight==null?1:opts.lineWeight, ts=opts.textScale==null?1:opts.textScale;

  const CAN={matrix:[1440,1120],fragmentation:[1200,1400],platformless:[1480,1040],kronos:[1160,1460],gaia:[1320,1200],together:[1480,1100],proof:[1420,1120],pipeline:[1180,1440],months:[1460,1040],cost:[1460,1060],nolockin:[1200,1380],freeeng:[1480,1080],auditable:[1500,1080]};
  let [LW,Ht]=CAN[scene]||[1320,1180];
  if(scene==='kronos'&&variant==='B'){LW=1520;Ht=1080;}
  if(scene==='gaia'&&variant==='B'){LW=1520;Ht=1060;}
  if(scene==='together'&&variant==='B'){LW=1520;Ht=1040;}
  if(scene==='proof'&&variant==='B'){LW=1520;Ht=1020;}
  if(scene==='fragmentation'&&variant==='B'){LW=1520;Ht=1080;}
  if(scene==='pipeline'&&(variant==='B'||variant==='C')){LW=1560;Ht=1020;}
  if(['months','cost','nolockin','freeeng','auditable'].includes(scene)&&variant==='B'){LW=1560;Ht=1000;}
  if(variant==='C'){LW=1520;Ht=1010;}
  const CAM={gaia:{az:26,el:36,dist:3.0},kronos:{az:26,el:14,dist:2.95},fragmentation:{az:24,el:15,dist:3.0},proof:{az:28,el:20,dist:3.0},pipeline:{az:28,el:16,dist:2.95},default:{az:28,el:16,dist:2.95}};
  const cam=CAM[scene]||CAM.default;
  const az=(opts.az==null?cam.az:opts.az)*Math.PI/180, el=(opts.el==null?cam.el:opts.el)*Math.PI/180, dist=opts.dist||cam.dist;

  const T=[0,0,0],UP=[0,0,1];
  const E=[T[0]+dist*Math.sin(az)*Math.cos(el),T[1]-dist*Math.cos(az)*Math.cos(el),T[2]+dist*Math.sin(el)];
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],norm=a=>{const m=Math.hypot(...a);return[a[0]/m,a[1]/m,a[2]/m];};
  const fwd=norm(sub(T,E)),right=norm(cross(fwd,UP)),up=cross(right,fwd);
  const raw=p=>{const r=[p[0]-E[0],p[1]-E[1],p[2]-E[2]];const cz=dot(r,fwd);return[dot(r,right)/cz,dot(r,up)/cz,cz];};
  let sc=1,cX=0,cY=0;
  function fit(pts,mar){mar=mar||120;let mnX=1e9,mxX=-1e9,mnY=1e9,mxY=-1e9;for(const p of pts){const r=raw(p);mnX=Math.min(mnX,r[0]);mxX=Math.max(mxX,r[0]);mnY=Math.min(mnY,r[1]);mxY=Math.max(mxY,r[1]);}
    sc=Math.min((LW-2*mar)/(mxX-mnX||1),(Ht-2*mar)/(mxY-mnY||1));cX=(mnX+mxX)/2;cY=(mnY+mxY)/2;}
  const P=w=>{const r=raw(w);return[LW/2+(r[0]-cX)*sc,Ht/2-(r[1]-cY)*sc,r[2]];};
  const f=n=>Math.round(n*10)/10;const parts=[];const push=x=>parts.push(x);
  push(`<rect x="0" y="0" width="${LW}" height="${Ht}" fill="var(--bg)"/>`);

  // ---------- shared branded primitives ----------
  const LINE=(a,b,st,sw,op,dash)=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${st}" stroke-width="${f((sw||1)*lw)}" stroke-opacity="${op==null?1:op}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
  const seg=(wa,wb,st,sw,op,dash)=>push(LINE(P(wa),P(wb),st,sw,op,dash));
  const route=(wa,wb,st,sw,op)=>{const a=P(wa),b=P(wb),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;push(`<path d="M${f(a[0])},${f(a[1])} C${f(mx)},${f(a[1])} ${f(mx)},${f(b[1])} ${f(b[0])},${f(b[1])}" fill="none" stroke="${st}" stroke-width="${f((sw||1)*lw)}" stroke-opacity="${op==null?1:op}"/>`);};
  function cloud(w,rad,nn){const c=P(w);let s='';for(let k=0;k<(nn||14);k++){const an=rand()*6.283,rr=(rad||18)*(0.2+rand()*0.85);s+=`<circle cx="${f(c[0]+Math.cos(an)*rr)}" cy="${f(c[1]+Math.sin(an)*rr*0.72)}" r="${rand()<0.3?1.7:1.1}" fill="var(--dot)" fill-opacity="${f(0.4+rand()*0.5)}"/>`;}push(s);push(`<circle cx="${f(c[0])}" cy="${f(c[1])}" r="3" fill="none" stroke="var(--edge)" stroke-width="${f(lw)}" stroke-opacity="0.6"/>`);}
  function die(w,cell,shift,verify){const c=P(w);const g=3;cell=cell||9;const ox=c[0]-g*cell/2,oy=c[1]-g*cell/2;let s=`<rect x="${f(ox-3)}" y="${f(oy-3)}" width="${f(g*cell+6)}" height="${f(g*cell+6)}" fill="none" stroke="#9aa0a6" stroke-width="${f(1.4*lw)}" stroke-opacity="0.9"/>`;
    for(let a=0;a<g;a++)for(let b=0;b<g;b++){const gu=a/g,gv=b/g;s+=`<rect x="${f(ox+a*cell)}" y="${f(oy+b*cell)}" width="${f(cell-1.5)}" height="${f(cell-1.5)}" fill="${hsl2hex(58+(shift||0)+gu*80-gv*14,68,56+gu*8)}"/>`;}
    if(verify){const r=g*cell/2+8;s+=`<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(r)}" fill="none" stroke="${accent}" stroke-width="${f(1.4*lw)}" stroke-opacity="0.8"/><path d="M${f(c[0]-5)},${f(c[1])} l4,4 l7,-9" fill="none" stroke="${accent}" stroke-width="${f(1.8*lw)}" stroke-linecap="round"/>`;}
    push(s);}
  function node(w,r,fill,op){const c=P(w);push(`<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(r)}" fill="${fill}" fill-opacity="${op==null?1:op}"/>`);}
  function ring(w,r,st,op){const c=P(w);push(`<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(r)}" fill="none" stroke="${st}" stroke-width="${f(1.2*lw)}" stroke-opacity="${op==null?0.7:op}"/>`);}
  function ribbon(A,B,spread,op,K){K=K||20;let poly=[P(V.sub(A,spread)),P(V.sub(B,spread)),P(V.add(B,spread)),P(V.add(A,spread))];
    push(`<polygon points="${poly.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="var(--mesh)" fill-opacity="0.05" stroke="var(--edge)" stroke-width="${f(1.2*lw)}" stroke-opacity="0.55"/>`);
    let s='';for(let k=0;k<K;k++){const t=k/(K-1),p=V.lerp(A,B,t);s+=LINE(P(V.sub(p,spread)),P(V.add(p,spread)),hsl2hex(206+k*4,72,60),1.1,op==null?0.65:op);}push(s);}
  function tx(w,dx,dy,t,size,fill){const p=P(w);return `<text x="${f(p[0]+dx)}" y="${f(p[1]+dy)}" font-family="var(--mono)" font-size="${f(size*ts)}" letter-spacing="0.12em" fill="${fill}">${t}</text>`;}
  function caption(title,sub){if(!labels)return;push(`<text x="40" y="${Ht-46}" font-family="var(--mono)" font-size="${f(13*ts)}" letter-spacing="0.14em" fill="var(--edge)">${title}</text>`);if(sub)push(`<text x="40" y="${Ht-28}" font-family="var(--mono)" font-size="${f(9.5*ts)}" letter-spacing="0.14em" fill="var(--muted)">${sub}</text>`);}
  function lbl(w,dx,dy,title,sub){if(!labels)return;push(tx(w,dx,dy,title,14,'var(--edge)'));if(sub)push(tx(w,dx,dy+14,sub,9.5,'var(--muted)'));}
  // ---- cover-grade primitives (descent / ILS craft) ----
  const QUAD=(A,B,C,D,col,op)=>`<polygon points="${f(A[0])},${f(A[1])} ${f(B[0])},${f(B[1])} ${f(C[0])},${f(C[1])} ${f(D[0])},${f(D[1])}" fill="${col}"${op!=null?` fill-opacity="${op}"`:''}/>`;
  const hxsh=(base,m)=>'#'+base.map(v=>{const x=Math.max(0,Math.min(255,Math.round(v*m)));return x.toString(16).padStart(2,'0');}).join('');
  function planeXY(zc,hx,hy,glass){const A=P([-hx,-hy,zc]),B=P([hx,-hy,zc]),C=P([hx,hy,zc]),D=P([-hx,hy,zc]);push(`<polygon points="${[A,B,C,D].map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="var(--mesh)" fill-opacity="${glass?0.045:0.02}" stroke="var(--edge)" stroke-width="${f(1*lw)}" stroke-opacity="0.4"/>`);}
  function box3W(x0,x1,y0,y1,zb,h,base){const zt=zb+h;const xPos=E[0]>((x0+x1)/2),yPos=E[1]>((y0+y1)/2);const xe=xPos?x1:x0,ye=yPos?y1:y0;let s='';
    if(h>0.001){s+=QUAD(P([xe,y0,zt]),P([xe,y1,zt]),P([xe,y1,zb]),P([xe,y0,zb]),hxsh(base,0.55));s+=QUAD(P([x0,ye,zt]),P([x1,ye,zt]),P([x1,ye,zb]),P([x0,ye,zb]),hxsh(base,0.42));}
    s+=QUAD(P([x0,y0,zt]),P([x1,y0,zt]),P([x1,y1,zt]),P([x0,y1,zt]),hxsh(base,1));push(s);}
  function box3ghost(x0,x1,y0,y1,zb,h){const zt=zb+h;const corners=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];let s='';
    for(let k=0;k<4;k++){const a=corners[k],b=corners[(k+1)%4];s+=LINE(P([a[0],a[1],zt]),P([b[0],b[1],zt]),'var(--edge)',0.8,0.22,'5 5');}
    for(const c of corners)s+=LINE(P([c[0],c[1],zb]),P([c[0],c[1],zt]),'var(--edge)',0.8,0.16,'5 5');push(s);}
  function gradSlabXY(zc,hx,hy){planeXY(zc,hx,hy,true);const K=16;let s='';for(let k=0;k<K;k++){const t=k/(K-1),x=-hx+2*hx*t;s+=LINE(P([x,-hy,zc]),P([x,hy,zc]),hsl2hex(206+k*5,72,60),1.0,0.55);}push(s);}
  function dieRich(wc,hs,hgt){ // in-perspective 3D die — this generator's own style + colors
    hs=hs||0.30; hgt=hgt||0.05;                       // world half-size + extrusion height
    const cx=wc[0],cy=wc[1],cz=wc[2];
    const x0=cx-hs,x1=cx+hs,y0=cy-hs,y1=cy+hs,zt=cz+hgt;
    // substrate slab (dark) with slight extrusion — camera-facing walls
    const xPos=E[0]>cx,yPos=E[1]>cy,xe=xPos?x1:x0,ye=yPos?y1:y0;
    if(hgt>0.001){push(QUAD(P([xe,y0,zt]),P([xe,y1,zt]),P([xe,y1,cz]),P([xe,y0,cz]),'#0e0f12'));push(QUAD(P([x0,ye,zt]),P([x1,ye,zt]),P([x1,ye,cz]),P([x0,ye,cz]),'#0a0b0d'));}
    push(QUAD(P([x0,y0,zt]),P([x1,y0,zt]),P([x1,y1,zt]),P([x0,y1,zt]),'#141414'));
    // frame (silver) + copper inner edge on top face
    const TL=P([x0,y0,zt]),TR=P([x1,y0,zt]),BR=P([x1,y1,zt]),BL=P([x0,y1,zt]);
    push(`<polygon points="${[TL,TR,BR,BL].map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" stroke="#9aa0a6" stroke-width="${f(1.6*lw)}" stroke-opacity="0.9"/>`);
    const inm=0.12,ix0=x0+(x1-x0)*inm,ix1=x1-(x1-x0)*inm,iy0=y0+(y1-y0)*inm,iy1=y1-(y1-y0)*inm;
    push(`<polygon points="${[P([ix0,iy0,zt]),P([ix1,iy0,zt]),P([ix1,iy1,zt]),P([ix0,iy1,zt])].map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" stroke="#C98A4B" stroke-width="${f(1*lw)}" stroke-opacity="0.6"/>`);
    // iridescent grid cells ON the top face, in perspective — same green palette as now
    const g=4,pad=0.14,gx0=x0+(x1-x0)*pad,gx1=x1-(x1-x0)*pad,gy0=y0+(y1-y0)*pad,gy1=y1-(y1-y0)*pad;
    let sgrid='';for(let a=0;a<g;a++)for(let b=0;b<g;b++){const u0=gx0+(gx1-gx0)*a/g,u1=gx0+(gx1-gx0)*(a+0.82)/g,v0=gy0+(gy1-gy0)*b/g,v1=gy0+(gy1-gy0)*(b+0.82)/g;const gu=a/g,gv=b/g;
      sgrid+=QUAD(P([u0,v0,zt]),P([u1,v0,zt]),P([u1,v1,zt]),P([u0,v1,zt]),hsl2hex(58+gu*80-gv*14,68,54+gu*10));}
    push(sgrid);
  }
  // ---- heavy infrastructure primitives (cover-grade) ----
  function glowRoute(wa,wb,sw){const a=P(wa),b=P(wb),mx=(a[0]+b[0])/2;const d=`M${f(a[0])},${f(a[1])} C${f(mx)},${f(a[1])} ${f(mx)},${f(b[1])} ${f(b[0])},${f(b[1])}`;
    push(`<path d="${d}" fill="none" stroke="${accent}" stroke-width="${f((sw||1.6)*lw*2.4)}" stroke-opacity="0.16"/>`);
    push(`<path d="${d}" fill="none" stroke="${accent}" stroke-width="${f((sw||1.6)*lw)}" stroke-opacity="0.95"/>`);}
  function densCloud(w,rad,nn){const c=P(w);let s='';for(let k=0;k<(nn||120);k++){const an=rand()*6.283,rr=(rad||60)*Math.pow(rand(),0.6);const dep=rr/(rad||60);s+=`<circle cx="${f(c[0]+Math.cos(an)*rr)}" cy="${f(c[1]+Math.sin(an)*rr*0.62)}" r="${rand()<0.14?1.9:1.15}" fill="var(--dot)" fill-opacity="${f(0.25+0.6*dep+(rand()-0.5)*0.2)}"/>`;}push(s);}
  // a deep infrastructure core: stacked shaded strata + gradient crown + internal cell texture
  function infraCore(cx,cy,cz,hx,hy,strata){
    // draw strata bottom->top for correct overlap (higher z = nearer top)
    const zB=cz-0.30, layerH=0.60/strata.length;
    for(let i=0;i<strata.length;i++){const st=strata[i];const z0=zB+i*layerH;const inset=st.inset||0;
      const x0=cx-hx+inset,x1=cx+hx-inset,y0=cy-hy+inset,y1=cy+hy-inset;
      box3W(x0,x1,y0,y1,z0,layerH*0.86,st.base);
      // internal cell texture on the top face of this stratum
      if(st.cells){const zt=z0+layerH*0.86;const G=st.cells;for(let a=0;a<G;a++)for(let b=0;b<G;b++){const u0=x0+(x1-x0)*a/G,u1=x0+(x1-x0)*(a+0.82)/G,v0=y0+(y1-y0)*b/G,v1=y0+(y1-y0)*(b+0.82)/G;
        const col=st.grad?hsl2hex(206+((a+b)/(2*G))*40,70,52+18*((a)/G)):hxsh(st.base,1.35);
        push(QUAD(P([u0,v0,zt]),P([u1,v0,zt]),P([u1,v1,zt]),P([u0,v1,zt]),col, st.grad?0.9:0.5));}}
    }
    // gradient crown slab on very top
    const zc2=zB+strata.length*layerH+0.005;

  function isoRig(ox,oy,unit){

      else if(glyph==='pipe'){for(let k=0;k<4;k++)push(`<line x1="${f(ctr[0]-unit*0.28)}" y1="${f(ctr[1]-9+k*6)}" x2="${f(ctr[0]+unit*0.28)}" y2="${f(ctr[1]-9+k*6)}" stroke="var(--bg)" stroke-width="1.6"/>`);}

    function die(gx,gy,gz,sz,checked){sz=sz||1.15;let s='';const A=p(gx,gy,gz),B=p(gx+sz,gy,gz),C0=p(gx+sz,gy+sz,gz),D=p(gx,gy+sz,gz);

    lbl([0,0,1.05],-30,-30,'ONE PIPELINE','ANY VENDOR');

  };

  // ---- FREE YOUR ENGINEERS: agents deploy, team builds models ----
  S.freeeng=()=>{

      const eng=[-1.4,-1.15,-0.9];for(const ex of eng)node([ex,0,0.5],4,'var(--edge)',0.9);

      for(let i=0;i<4;i++){const sv=(i-1.5)*0.42;const t=[1.45,0,sv*0.85];glowRoute([0.35,0,0.05],t,1.0);dieRich(t,0.11,0.04);}

  S.auditable=()=>{

    if(variant==='C'){const R=isoRig(320,520,46);

    // A — source plane on top, deterministic identical outputs, cert badges
    fit([[-1.3,0,1.15],[1.35,0,-1.0],[0,0.65,0],[0,-0.65,0]]);
    planeXY(0.95,0.72,0.42,true);

    caption('AUDITABLE · DETERMINISTIC','READABLE SOURCE · SAME INPUT = SAME OUTPUT · ISO 26262 · DO-178C · IEC 62304');
